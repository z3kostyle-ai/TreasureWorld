<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TreasureWorld</title>
<link rel="icon" href="https://cdn.jsdelivr.net/npm/twemoji@14/assets/72x72/1f5fa.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-light:#FAC775;
  --teal:#0F6E56;--teal-bg:#E1F5EE;
  --purple:#7F77DD;--purple-bg:#EEEDFE;--purple-dark:#26215C;
  --green-bg:#EAF3DE;--green:#27500A;
  --coral-bg:#FAECE7;--coral:#4A1B0C;
  --gray-bg:#F1EFE8;--gray:#444441;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8f7f4;color:#1a1a18;min-height:100vh;}
.app{max-width:680px;margin:0 auto;background:#fff;min-height:100vh;border-left:0.5px solid #e0ddd6;border-right:0.5px solid #e0ddd6;}

/* TOPBAR */
.topbar{background:#fff;border-bottom:0.5px solid #e0ddd6;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100;}
.logo{font-size:14px;font-weight:600;color:#1a1a18;display:flex;align-items:center;gap:7px;}
.logo-icon{width:28px;height:28px;background:var(--amber-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;}
.top-tools{display:flex;gap:5px;align-items:center;}
.lang-select{padding:4px 6px;font-size:12px;border:0.5px solid #e0ddd6;border-radius:6px;background:#fff;color:#1a1a18;}
.tabs{display:flex;gap:3px;flex-wrap:wrap;width:100%;}
.tab{padding:5px 11px;font-size:12px;border:0.5px solid #e0ddd6;border-radius:6px;cursor:pointer;background:transparent;color:#888;}
.tab.active{background:#f1efe8;color:#1a1a18;font-weight:500;}
.tab:hover:not(.active){background:#f8f7f4;}

/* VIEWS */
.view{display:none;}.view.active{display:block;}
.panel{padding:14px 16px;}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.sh h2{font-size:15px;font-weight:500;}

/* BUTTONS */
.btn{padding:7px 13px;font-size:12px;border:0.5px solid #e0ddd6;border-radius:6px;cursor:pointer;background:#fff;color:#1a1a18;transition:background .12s;}
.btn:hover{background:#f1efe8;}
.btn:disabled{opacity:.5;cursor:default;}
.btn-amber{background:var(--amber-bg);border-color:var(--amber-light);color:#633806;}
.btn-amber:hover{background:var(--amber-light);}
.btn-teal{background:var(--teal-bg);border-color:#9FE1CB;color:#085041;}
.btn-purple{background:var(--purple-bg);border-color:#AFA9EC;color:var(--purple-dark);}
.btn-sm{padding:4px 9px;font-size:11px;}
.btn-full{width:100%;margin-top:6px;}
.btn-big{padding:11px 14px;font-size:14px;}
.link-btn{background:none;border:none;color:#888;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px;}

/* FORMS */
.field{margin-bottom:10px;}
.field label{display:block;font-size:11px;color:#888;margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;font-size:13px;border:0.5px solid #e0ddd6;border-radius:6px;background:#fff;color:#1a1a18;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#AFA9EC;}
.field textarea{height:55px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr;}}

/* BADGES */
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;}
.b-green{background:var(--green-bg);color:var(--green);}
.b-gray{background:var(--gray-bg);color:var(--gray);}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:10001;display:none;max-width:320px;text-align:center;}
.toast.show{display:block;animation:fadein .2s,fadeout .3s 2.8s forwards;}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeout{to{opacity:0;}}

/* POPUPS */
.trophy-popup,.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;align-items:center;justify-content:center;padding:16px;}
.trophy-popup.show,.modal.show{display:flex;}
.trophy-inner{background:#fff;border-radius:14px;padding:2rem 1.5rem;text-align:center;max-width:280px;border:0.5px solid #e0ddd6;}
.trophy-big{font-size:60px;margin-bottom:10px;}
.trophy-popup-title{font-size:16px;font-weight:600;margin-bottom:5px;}
.trophy-popup-desc{font-size:12px;color:#888;line-height:1.6;margin-bottom:12px;}
.xp-flash{font-size:22px;font-weight:600;color:var(--purple);margin-bottom:14px;}
.modal-inner{background:#fff;border-radius:14px;padding:18px 16px;width:100%;max-width:340px;}
.modal-inner h3{font-size:16px;margin-bottom:4px;}
.modal-inner p{font-size:12px;color:#888;margin-bottom:12px;}

/* PROFIL / COMPTE */
.setup-wrap{max-width:380px;margin:0 auto;padding:1.5rem 1rem;}
.setup-wrap h2{font-size:18px;font-weight:600;margin-bottom:6px;}
.setup-wrap p{font-size:12px;color:#888;margin-bottom:1.2rem;line-height:1.6;}
.welcome-hero{text-align:center;font-size:54px;margin-bottom:6px;}
.sep{display:flex;align-items:center;gap:8px;color:#aaa;font-size:11px;margin:12px 0;}
.sep::before,.sep::after{content:'';flex:1;height:0.5px;background:#e0ddd6;}
.note{font-size:11px;color:#888;margin-top:8px;line-height:1.5;}
.avatar-big{width:72px;height:72px;border-radius:50%;background:#f1efe8;border:2px solid #e0ddd6;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;cursor:pointer;transition:transform .15s;}
.avatar-big:hover{transform:scale(1.05);}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:8px 0 14px;background:#f8f7f4;border-radius:10px;padding:10px;}
.emo-btn{font-size:20px;padding:4px;border-radius:6px;cursor:pointer;text-align:center;border:1.5px solid transparent;line-height:1;transition:background .1s;}
.emo-btn:hover{background:#fff;}
.emo-btn.sel{border-color:var(--purple);background:var(--purple-bg);}
.profile-header{background:#f8f7f4;padding:16px;display:flex;align-items:center;gap:14px;border-bottom:0.5px solid #e0ddd6;}
.p-avatar{width:58px;height:58px;border-radius:50%;background:#fff;border:2px solid #e0ddd6;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;}
.p-name{font-size:16px;font-weight:600;}
.p-sub{font-size:12px;color:#888;margin-top:2px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.stat-box{background:#f8f7f4;border-radius:8px;padding:10px;text-align:center;}
.stat-num{font-size:22px;font-weight:600;}
.stat-lbl{font-size:10px;color:#888;margin-top:2px;}
.xp-bar-wrap{height:6px;background:#f1efe8;border-radius:99px;margin:5px 0;}
.xp-bar{height:6px;border-radius:99px;background:var(--purple);transition:width .5s;}
.trophy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin:10px 0;}
.trophy-item{background:#f8f7f4;border-radius:8px;padding:10px 6px;text-align:center;border:0.5px solid #e0ddd6;transition:transform .15s;}
.trophy-item:hover{transform:scale(1.05);}
.trophy-item.locked{opacity:.3;filter:grayscale(1);}
.trophy-icon-big{font-size:26px;margin-bottom:4px;}
.trophy-name-sm{font-size:10px;color:#888;line-height:1.3;}
.account-box{border:0.5px solid #e0ddd6;border-radius:10px;padding:12px 13px;margin-top:14px;font-size:12px;}
.account-box.guest{background:var(--amber-bg);border-color:var(--amber-light);}
.account-box b{font-size:13px;}
.account-box .acc-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}

/* DISCOVER */
#discover-map{width:100%;height:300px;}
.disc-bar{padding:8px 13px;font-size:11px;font-weight:500;color:#888;border-bottom:0.5px solid #e0ddd6;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.disc-bar select{font-size:11px;padding:3px 6px;border:0.5px solid #e0ddd6;border-radius:6px;background:#fff;}
.hunt-list-scroll{max-height:280px;overflow-y:auto;}
.hunt-mini{padding:10px 14px;border-bottom:0.5px solid #e0ddd6;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;transition:background .1s;}
.hunt-mini:hover{background:#f8f7f4;}
.hunt-mini.sel{background:var(--amber-bg);}
.hm-title{font-size:13px;font-weight:500;margin-bottom:3px;}
.hm-meta{font-size:11px;color:#888;display:flex;gap:8px;flex-wrap:wrap;}

/* PLAY */
.player-bar{padding:10px 14px;background:#f8f7f4;border-bottom:0.5px solid #e0ddd6;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.prog-wrap{height:4px;background:#e0ddd6;border-radius:99px;width:160px;margin:4px 0;}
.prog-fill{height:4px;border-radius:99px;background:var(--purple);transition:width .4s;}
#player-map{width:100%;height:220px;}
.step-body{padding:12px 15px;}
.enigme-txt{font-size:13px;line-height:1.6;margin-bottom:10px;white-space:pre-line;}
.prox-box{background:#f8f7f4;border-radius:8px;padding:10px 13px;margin-bottom:10px;}
.prox-row{display:flex;align-items:center;gap:10px;}
.prox-num{font-size:24px;font-weight:600;}
.prox-track{flex:1;height:5px;background:#e0ddd6;border-radius:99px;overflow:hidden;}
.prox-fill{height:5px;border-radius:99px;background:var(--purple);transition:width .4s;}
.prox-locked{font-size:11px;color:#888;margin-top:5px;font-style:italic;}
.prox-ok{display:none;font-size:11px;color:var(--green);background:var(--green-bg);border-radius:6px;padding:5px 9px;margin-top:5px;}
.ans-row{display:flex;gap:7px;}
.ans-row input{flex:1;font-size:13px;}
.hint-lnk{font-size:11px;color:#888;text-decoration:underline;cursor:pointer;margin-top:5px;display:inline-block;}
.hint-box{display:none;background:#f8f7f4;border-radius:6px;padding:7px 10px;font-size:12px;color:#888;margin-top:5px;}
.fb-ok{display:none;background:var(--green-bg);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--green);margin-top:7px;}
.fb-ko{display:none;background:#FCEBEB;border-radius:6px;padding:8px 12px;font-size:12px;color:#791F1F;margin-top:7px;}
.step-input{display:none;}

/* LEADERBOARD */
#lb-map{width:100%;height:240px;}
.lb-filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.filter-btn{padding:4px 10px;font-size:11px;border:0.5px solid #e0ddd6;border-radius:99px;cursor:pointer;background:transparent;color:#888;}
.filter-btn.active{background:var(--purple-bg);border-color:#AFA9EC;color:var(--purple-dark);}
.lb-table{background:#fff;border:0.5px solid #e0ddd6;border-radius:10px;overflow:hidden;}
.lb-header{display:grid;grid-template-columns:30px 30px 1fr 55px 60px;gap:8px;padding:7px 13px;background:#f8f7f4;border-bottom:0.5px solid #e0ddd6;}
.lb-header span{font-size:10px;color:#888;font-weight:500;}
.lb-row{display:grid;grid-template-columns:30px 30px 1fr 55px 60px;align-items:center;gap:8px;padding:9px 13px;border-bottom:0.5px solid #e0ddd6;transition:background .1s;}
.lb-row:last-child{border-bottom:none;}
.lb-row.me{background:var(--amber-bg);}
.lb-row:hover:not(.me){background:#f8f7f4;}
.lb-rank{font-size:12px;font-weight:600;color:#888;text-align:center;}
.lb-rank.r1{color:var(--amber);font-size:15px;}
.lb-rank.r2{color:#444;font-size:14px;}
.lb-rank.r3{color:#993C1D;font-size:14px;}
.lb-emo{font-size:20px;text-align:center;}
.lb-pseudo{font-size:12px;font-weight:500;}
.lb-country{font-size:10px;color:#888;}
.lb-xp{font-size:12px;font-weight:500;text-align:right;}
.lb-badges{display:flex;gap:2px;justify-content:flex-end;flex-wrap:wrap;}

/* CREATOR */
#creator-map{width:100%;height:250px;border-radius:8px;overflow:hidden;margin-bottom:10px;}
.c-steps{display:flex;flex-direction:column;gap:7px;margin:8px 0;}
.c-step-item{background:#f8f7f4;border:0.5px solid #e0ddd6;border-radius:7px;padding:8px 10px;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;}
.c-step-num{width:22px;height:22px;border-radius:50%;background:var(--amber-bg);color:#633806;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.c-step-txt{font-size:12px;}
.c-step-sub{font-size:11px;color:#888;margin-top:2px;}
.del-btn{border:none;background:none;color:#aaa;cursor:pointer;font-size:11px;padding:2px 5px;border-radius:4px;}
.del-btn:hover{color:#E24B4A;background:#FCEBEB;}
.add-form{background:#f8f7f4;border:0.5px dashed #e0ddd6;border-radius:8px;padding:11px;margin-top:8px;}
.map-hint{font-size:11px;color:var(--teal);background:var(--teal-bg);padding:6px 10px;border-radius:6px;margin-bottom:8px;}
.coord-info{font-size:11px;color:var(--purple-dark);background:var(--purple-bg);padding:6px 10px;border-radius:6px;margin-bottom:8px;}

/* SCANNER QR */
.scan-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9997;align-items:center;justify-content:center;padding:16px;}
.scan-modal.show{display:flex;}
.scan-inner{background:#fff;border-radius:14px;padding:14px;width:100%;max-width:360px;}
.scan-title{font-size:14px;font-weight:600;margin-bottom:8px;}
.scan-video-wrap{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:1/1;}
.scan-video-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
.scan-frame{position:absolute;inset:18%;border:2px solid rgba(255,255,255,.85);border-radius:12px;pointer-events:none;}
.scan-msg{font-size:11px;color:#888;margin:8px 0;min-height:14px;}
.print-box{background:var(--purple-bg);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12px;color:var(--purple-dark);display:none;align-items:center;justify-content:space-between;gap:8px;}

/* SON */
.snd-btn{padding:4px 8px;font-size:13px;border:0.5px solid #e0ddd6;border-radius:6px;cursor:pointer;background:transparent;line-height:1;}

/* MES CHASSES + TRADUCTIONS */
.mh-card{border:0.5px solid #e0ddd6;border-radius:10px;padding:12px 13px;margin-bottom:10px;}
.mh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
.mh-name{font-size:14px;font-weight:600;}
.mh-sub{font-size:11px;color:#888;margin-top:2px;}
.mh-code{font-family:monospace;font-size:13px;letter-spacing:2px;background:var(--amber-bg);color:#633806;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.mh-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.mh-stat{background:#f8f7f4;border-radius:7px;padding:7px 4px;text-align:center;}
.mh-stat b{display:block;font-size:15px;}
.mh-stat span{font-size:9px;color:#888;}
.mh-actions{display:flex;gap:6px;flex-wrap:wrap;}
.tr-langs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px;}
.tr-lang{padding:6px 10px;font-size:12px;border:0.5px solid #e0ddd6;border-radius:99px;cursor:pointer;background:#fff;}
.tr-lang.active{background:var(--purple-bg);border-color:#AFA9EC;color:var(--purple-dark);font-weight:500;}
.tr-step{background:#f8f7f4;border-radius:8px;padding:10px 11px;margin-bottom:9px;}
.tr-orig{font-size:11px;color:#888;margin-bottom:6px;line-height:1.5;white-space:pre-line;}

/* IMMERSION */
.parchment{background:linear-gradient(180deg,#FBF3E1 0%,#F5E6C4 100%);border:1px solid #E2CC9A;border-radius:12px;padding:16px 15px;box-shadow:inset 0 0 30px rgba(186,117,23,.12);color:#3B2A12;}
.parchment h3{font-family:Georgia,'Times New Roman',serif;font-size:19px;margin-bottom:4px;}
.parchment .story{font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.65;white-space:pre-line;margin:10px 0 14px;min-height:40px;}
.intro-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;}
.intro-meta span{background:rgba(255,255,255,.6);border-radius:99px;padding:2px 8px;}
.typing::after{content:'▍';animation:blink .8s steps(1) infinite;color:var(--amber);}
@keyframes blink{50%{opacity:0;}}
.step-enter{animation:stepin .45s ease-out;}
@keyframes stepin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.compass{display:flex;align-items:center;gap:12px;margin-top:9px;padding-top:9px;border-top:0.5px dashed #e0ddd6;}
.compass-dial{width:46px;height:46px;border-radius:50%;background:#fff;border:1.5px solid #e0ddd6;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.compass-arrow{font-size:24px;line-height:1;transition:transform .35s ease-out;color:var(--amber);}
.heat{font-size:14px;font-weight:600;}
.heat-sub{font-size:11px;color:#888;margin-top:2px;}
.prox-box.reached{animation:glow 1.2s ease-out 2;}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(127,119,221,.55);}100%{box-shadow:0 0 0 14px rgba(127,119,221,0);}}
.shake{animation:shake .35s;}
@keyframes shake{20%,60%{transform:translateX(-6px);}40%,80%{transform:translateX(6px);}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10000;}

/* LOADING */
.loading{text-align:center;padding:2rem;font-size:13px;color:#888;}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #e0ddd6;border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;margin-right:7px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- TROPHÉE -->
<div class="trophy-popup" id="trophy-popup">
  <div class="trophy-inner">
    <div class="trophy-big" id="tp-icon">🏆</div>
    <div class="trophy-popup-title" id="tp-title"></div>
    <div class="trophy-popup-desc" id="tp-desc"></div>
    <div class="xp-flash" id="tp-xp"></div>
    <button class="btn btn-amber btn-full" onclick="closePopup()" data-i18n="great"></button>
  </div>
</div>

<!-- MOT DE PASSE (après confirmation d'email, ou réinitialisation) -->
<div class="modal" id="pw-modal">
  <div class="modal-inner">
    <h3 id="pw-title"></h3>
    <p data-i18n="pw_sub"></p>
    <div class="field"><label data-i18n="password"></label><input type="password" id="pw-1" autocomplete="new-password"/></div>
    <div class="field"><label data-i18n="password2"></label><input type="password" id="pw-2" autocomplete="new-password" onkeydown="if(event.key==='Enter')savePassword()"/></div>
    <button class="btn btn-amber btn-full btn-big" onclick="savePassword()" data-i18n="pw_save"></button>
  </div>
</div>

<!-- SCANNER QR -->
<div class="scan-modal" id="scan-modal">
  <div class="scan-inner">
    <div class="scan-title" id="scan-title"></div>
    <div class="scan-video-wrap"><video id="scan-video" playsinline muted></video><div class="scan-frame"></div></div>
    <div class="scan-msg" id="scan-msg"></div>
    <div class="ans-row" style="margin-bottom:8px;">
      <input type="text" id="scan-manual" data-i18n-ph="scan_manual_ph" style="padding:8px 10px;border:0.5px solid #e0ddd6;border-radius:6px;" onkeydown="if(event.key==='Enter')submitManualScan()"/>
      <button class="btn btn-amber btn-sm" onclick="submitManualScan()" data-i18n="ok"></button>
    </div>
    <button class="btn btn-full" onclick="closeScanner()" data-i18n="close"></button>
  </div>
</div>

<div class="app">
<div class="topbar">
  <div class="logo"><div class="logo-icon">🗺</div>TreasureWorld</div>

function detectLang(){
  try{const s=localStorage.getItem('tw_lang');if(s&&I18N[s])return s;}catch(e){}
  for(const l of (navigator.languages||[navigator.language||'fr'])){
    const c=String(l).slice(0,2).toLowerCase();
    if(I18N[c])return c;
  }
  return 'en';
}
let LANG=detectLang();
function t(key,vars){
  let s=I18N[LANG]?.[key]??I18N.en[key]??I18N.fr[key]??key;
  if(typeof s!=='string')return s;
  if(vars)for(const k in vars)s=s.split('{'+k+'}').join(vars[k]);
  return s;
}

  document.documentElement.lang=LANG;

function flagOf(code){return String(code||'').toUpperCase().replace(/[A-Z]/g,c=>String.fromCodePoint(127397+c.charCodeAt(0)));}
function codeOfFlag(str){
  const cps=Array.from(String(str||'')).slice(0,2).map(c=>c.codePointAt(0));
  if(cps.length===2&&cps.every(c=>c>=0x1F1E6&&c<=0x1F1FF))return String.fromCharCode(...cps.map(c=>c-127397));
  return null;
}
const _regionNames={};
function countryName(code,lang=LANG){
  try{return (_regionNames[lang]||(_regionNames[lang]=new Intl.DisplayNames([lang],{type:'region'}))).of(code);}catch(e){return code;}
}
function countryLabel(stored){const c=codeOfFlag(stored);return c?flagOf(c)+' '+countryName(c):(stored||'');}
function countryStored(code,lang=LANG){return flagOf(code)+' '+countryName(code,lang);}
function fillCountrySelect(sel,selected){
  const opt=c=>`<option value="${c}"${c===selected?' selected':''}>${flagOf(c)} ${esc(countryName(c))}</option>`;
  const rest=COUNTRY_CODES.filter(c=>!COUNTRY_TOP.includes(c)).sort((a,b)=>countryName(a).localeCompare(countryName(b),LANG));
  sel.innerHTML=COUNTRY_TOP.map(opt).join('')+'<option disabled>──────────</option>'+rest.map(opt).join('');
}
function defaultCountry(){
  const reg=(navigator.language||'').split('-')[1];
  if(reg&&COUNTRY_CODES.includes(reg.toUpperCase()))return reg.toUpperCase();
  return {fr:'FR',de:'DE',nl:'NL',es:'ES',it:'IT',en:'GB'}[LANG]||'FR';
}

  void el.offsetWidth; el.className='toast show';
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.className='toast',dur);
}

function haversine(la1,ln1,la2,ln2){
  const R=6371000,dL=(la2-la1)*Math.PI/180,dN=(ln2-ln1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dN/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

const ERR_KEYS={pseudo_pris:'e_pseudo_taken',pseudo_invalide:'e_pseudo_invalid',profil_requis:'t_need_profile',
  chasse_introuvable:'e_hunt_unknown',session_invalide:'e_session',position_requise:'e_position'};
function errMsg(e){
  const m=e?.message||String(e||'');
  const k=Object.keys(ERR_KEYS).find(k=>m.includes(k));
  return k?t(ERR_KEYS[k]):t('t_error',{msg:m});
}
// Erreurs des fonctions de connexion Supabase → message clair
function authErrMsg(e){
  const code=e?.code||'', m=(e?.message||'').toLowerCase();
  if(code==='invalid_credentials'||m.includes('invalid login'))return t('t_bad_login');
  if(code==='email_not_confirmed')return t('t_email_unconfirmed');
  if(code==='email_exists'||code==='user_already_exists'||m.includes('already been registered'))return t('t_email_exists');
  if(code.startsWith('over_')||m.includes('rate limit'))return t('t_too_many');
  if(code==='weak_password')return t('t_pw_short');
  if(m.includes('not enabled')||m.includes('disabled')||code==='provider_disabled'||code.includes('disabled'))return t('t_feature_off');
  return t('t_error',{msg:e?.message||e});
}

const isGuest=()=>!authUser||!!authUser.is_anonymous;
async function ensureAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){authUser=session.user;return session.user;}
  const {data,error}=await sb.auth.signInAnonymously();
  if(error){toast(t('e_connect',{msg:error.message}));throw error;}
  authUser=data.user;
  return data.user;
}
async function refreshAuthUser(){
  const {data}=await sb.auth.getUser();
  authUser=data?.user||authUser;
  return authUser;
}
function showPScreen(id){
  document.querySelectorAll('#view-profil .pscreen').forEach(s=>s.style.display=s.id===id?'block':'none');
  window.scrollTo(0,0);
}

// Écran de profil : mode invité, inscription, modification, ou compte sans profil
function openSetup(mode){
  setupMode=mode;
  if(mode==='edit'){
    document.getElementById('pseudo-input').value=profile.pseudo;
    selectedEmoji=profile.emoji;
    fillCountrySelect(document.getElementById('country-select'),profile.countryCode);
  }else{
    if(!document.getElementById('pseudo-input').value) fillCountrySelect(document.getElementById('country-select'),defaultCountry());
  }
  document.getElementById('setup-avatar').textContent=selectedEmoji;
  renderEmojiGrid();
  refreshSetupTexts();
  showPScreen('setup-screen');
}
function refreshSetupTexts(){
  const m=setupMode;
  document.getElementById('setup-title').textContent=m==='signup'?t('signup_title'):t('setup_title');
  document.getElementById('setup-email-wrap').style.display=m==='signup'?'block':'none';
  document.getElementById('setup-google').style.display=m==='signup'?'block':'none';
  document.getElementById('setup-submit').textContent=m==='signup'?t('create_account_btn'):m==='edit'?t('pw_save'):t('save_profile');
  document.getElementById('setup-note').textContent=m==='signup'?t('signup_note'):m==='guest'?t('guest_note'):'';
  document.getElementById('setup-back').style.display=m==='complete'?'none':'inline-block';
}
function setupBack(){showPScreen(profile.id?'profile-screen':'welcome-screen');}
function renderEmojiGrid(){
  document.getElementById('emoji-grid').innerHTML=EMOJIS.map(e=>`<div class="emo-btn${e===selectedEmoji?' sel':''}" onclick="pickEmoji(this,'${e}')">${e}</div>`).join('');
}
function toggleEmojiPicker(){
  const g=document.getElementById('emoji-grid');
  g.style.display=g.style.display==='none'?'grid':'none';
}
function pickEmoji(el,e){
  document.querySelectorAll('.emo-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel'); selectedEmoji=e;
  document.getElementById('setup-avatar').textContent=e;
}
async function submitSetup(){
  const pseudo=document.getElementById('pseudo-input').value.trim();
  if(!pseudo){toast(t('t_enter_pseudo'));return;}
  const code=document.getElementById('country-select').value;
  const email=document.getElementById('setup-email').value.trim();
  if(setupMode==='signup'&&!email){toast(t('t_need_email'));return;}
  const btn=document.getElementById('setup-submit'); btn.disabled=true;
  try{
    await ensureAuth();
    const isNew=!profile.id;
    const {data,error}=await sb.rpc('tw_save_profile',{p_pseudo:pseudo,p_emoji:selectedEmoji,p_country:countryStored(code)});
    if(error){toast(errMsg(error));return;}
    applyPlayerRow(data);
    await loadTrophies();
    showProfileScreen();
    if(setupMode==='signup') await linkEmail(email);
    else toast(isNew?t('t_welcome',{name:pseudo,emoji:selectedEmoji}):t('t_profile_updated'));
  }catch(e){console.error(e);}
  finally{btn.disabled=false;}
}
// Ajoute un email au compte invité : même compte, donc la progression est conservée
async function linkEmail(email){
  if(!email){toast(t('t_need_email'));return;}
  const {error}=await sb.auth.updateUser({email},{emailRedirectTo:SITE_URL});
  if(error){toast(authErrMsg(error));return;}
  await refreshAuthUser();
  renderAccountBox();
  toast(t('t_check_mail',{email}),6000);
}
// Avant de quitter un compte invité pour un compte existant : jeton de fusion
async function prepareHandoff(){
  if(!isGuest()||!profile.id)return null;
  const {data}=await sb.rpc('tw_guest_handoff');
  if(data){try{localStorage.setItem('tw_merge',data);}catch(e){}}
  return data;
}
async function afterLogin(){
  let token=null;
  try{token=localStorage.getItem('tw_merge');localStorage.removeItem('tw_merge');}catch(e){}
  await refreshAuthUser();
  if(token&&!isGuest()){
    const {data}=await sb.rpc('tw_merge_guest',{p_token:token});
    if(data?.merged) setTimeout(()=>toast(t('t_merged'),5000),1500);
  }
  profile={...EMPTY_PROFILE};
  await restoreProfile();
}
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-pw').value;
  if(!email||!password){toast(t('t_need_email'));return;}
  await prepareHandoff();
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){toast(authErrMsg(error));return;}
  document.getElementById('login-pw').value='';
  toast(t('t_logged_in'));
  await afterLogin();
}
async function loginWithGoogle(){
  await prepareHandoff();
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:SITE_URL}});
  if(error)toast(authErrMsg(error));
}
async function linkGoogle(){
  const {error}=await sb.auth.linkIdentity({provider:'google',options:{redirectTo:SITE_URL}});
  if(error)toast(authErrMsg(error));
}
async function loginWithPasskey(){
  if(!window.PublicKeyCredential){toast(t('t_passkey_unsupported'));return;}
  await prepareHandoff();
  const {error}=await sb.auth.signInWithPasskey();
  if(error){if(error.name!=='NotAllowedError')toast(authErrMsg(error));return;}
  toast(t('t_logged_in'));
  await afterLogin();
}
async function addPasskey(){
  if(!window.PublicKeyCredential){toast(t('t_passkey_unsupported'));return;}
  const {error}=await sb.auth.registerPasskey();
  if(error){if(error.name!=='NotAllowedError')toast(authErrMsg(error));return;}
  try{localStorage.setItem('tw_passkey_'+authUser.id,'1');}catch(e){}
  toast(t('t_passkey_added'));
  renderAccountBox();
}
async function forgotPassword(){
  const email=document.getElementById('login-email').value.trim();
  if(!email){toast(t('t_need_email'));return;}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});
  if(error){toast(authErrMsg(error));return;}
  toast(t('t_reset_sent'),5000);
}
let pwMode='new';
function openPwModal(mode){
  pwMode=mode;
  document.getElementById('pw-title').textContent=mode==='reset'?t('pw_title_reset'):t('pw_title_new');
  document.getElementById('pw-1').value='';document.getElementById('pw-2').value='';
  document.getElementById('pw-modal').classList.add('show');
  setTimeout(()=>document.getElementById('pw-1').focus(),100);
}
async function savePassword(){
  const a=document.getElementById('pw-1').value, b=document.getElementById('pw-2').value;
  if(a.length<8){toast(t('t_pw_short'));return;}
  if(a!==b){toast(t('t_pw_mismatch'));return;}
  const {error}=await sb.auth.updateUser({password:a,data:{tw_pw:true}});
  if(error&&error.code!=='same_password'){toast(authErrMsg(error));return;}
  document.getElementById('pw-modal').classList.remove('show');
  toast(t('t_pw_saved'));
  await refreshAuthUser();
  renderAccountBox();
}
// Compte email confirmé mais sans mot de passe choisi → on le demande
function maybeAskPassword(){
  const u=authUser;
  if(!u||u.is_anonymous||!u.email)return;
  const hasEmailIdentity=(u.identities||[]).some(i=>i.provider==='email');
  if(hasEmailIdentity&&!u.user_metadata?.tw_pw) openPwModal('new');
}
async function logout(){
  stopGPS();
  await sb.auth.signOut();
  authUser=null; profile={...EMPTY_PROFILE};
  currentHunt=null; sessionId=null;
  document.getElementById('pseudo-input').value='';
  document.getElementById('game-screen').style.display='none';
  document.getElementById('join-screen').style.display='block';
  showPScreen('welcome-screen');
  toast(t('t_logged_out'));
}
function renderAccountBox(){
  const box=document.getElementById('account-box');
  if(!box)return;
  const u=authUser;
  if(isGuest()){
    box.className='account-box guest';
    if(u?.new_email){
      box.innerHTML=`<div>📧 ${esc(t('acc_pending',{email:u.new_email}))}</div>
        <div class="acc-actions"><button class="btn btn-sm" onclick="linkEmail('${esc(u.new_email)}')">${esc(t('acc_resend'))}</button></div>`;
      return;
    }
    box.innerHTML=`<b>👤 ${esc(t('acc_guest_title'))}</b><div style="margin-top:4px;color:#633806;">${esc(t('acc_guest_txt'))}</div>

      <div class="acc-actions">
        <button class="btn btn-amber btn-sm" onclick="linkEmail(document.getElementById('acc-email').value.trim())">${esc(t('acc_secure'))}</button>
        <button class="btn btn-sm" onclick="linkGoogle()">${esc(t('acc_google_link'))}</button>
        <button class="btn btn-sm" onclick="showPScreen('login-screen')">${esc(t('acc_login_other'))}</button>
      </div>`;

    <div class="acc-actions">
      ${window.PublicKeyCredential?(pk?`<span class="badge b-green">${esc(t('acc_passkey_on'))}</span>`:`<button class="btn btn-purple btn-sm" onclick="addPasskey()">🔐 ${esc(t('acc_passkey_add'))}</button>`):''}

function applyPlayerRow(d){
  profile.id=d.id; profile.pseudo=d.pseudo; profile.emoji=d.emoji||profile.emoji; profile.country=d.country||'';
  profile.countryCode=codeOfFlag(d.country)||profile.countryCode;
  profile.xp=d.xp||0; profile.chasses=d.chasses_done||0; profile.created=d.created_hunts||0;
  profile.countriesPlayed=Array.isArray(d.countries_played)?d.countries_played:[];
  profile.countries=profile.countriesPlayed.length;
  selectedEmoji=profile.emoji;
}
async function loadTrophies(){
  const {data:td}=await sb.from('player_trophies').select('trophy_id').eq('player_id',profile.id);
  if(td){profile.unlockedTrophies=td.map(x=>x.trophy_id);profile.trophies=profile.unlockedTrophies.length;}
}
function showProfileScreen(){showPScreen('profile-screen');renderProfile();renderAccountBox();}
// Au démarrage / après connexion : profil lié au compte courant
async function restoreProfile(){
  const {data:{session}}=await sb.auth.getSession();
  authUser=session?.user||null;
  if(!session){showPScreen('welcome-screen');return;}
  const {data}=await sb.from('players').select('*').eq('auth_id',session.user.id).maybeSingle();
  if(data){applyPlayerRow(data);await loadTrophies();showProfileScreen();return;}
  if(isGuest())showPScreen('welcome-screen');
  else openSetup('complete');           // compte (email / Google) sans profil encore
}
async function refreshProfile(silent){
  if(!profile.id){if(!silent)toast(t('t_need_profile'));return;}
  const {data,error}=await sb.from('players').select('*').eq('id',profile.id).single();
  if(error){if(!silent)toast(t('t_error',{msg:error.message}));return;}
  applyPlayerRow(data);
  await loadTrophies();
  renderProfile();
  if(!silent)toast(t('t_profile_updated'));
}
function renderProfile(){
  const p=profile;
  document.getElementById('p-avatar').textContent=p.emoji;
  document.getElementById('p-name').textContent=p.pseudo;
  document.getElementById('p-country').textContent=countryLabel(p.country);
  const rank=getRank(p.xp);
  document.getElementById('p-rank-badge').innerHTML=`<span style="background:${rank.bg};color:${rank.col};padding:2px 9px;border-radius:99px;font-size:10px;font-weight:500;">${rank.icon} ${esc(rank.label)}</span>`;
  const level=Math.floor(p.xp/500)+1;
  document.getElementById('p-level').textContent=level;
  document.getElementById('xp-bar').style.width=(p.xp%500/500*100)+'%';
  document.getElementById('xp-label').textContent=t('xp_level',{xp:p.xp,l:level});
  document.getElementById('s-chasses').textContent=p.chasses;
  document.getElementById('s-xp').textContent=p.xp;
  document.getElementById('s-trophees').textContent=p.unlockedTrophies.length;
  document.getElementById('trophy-grid').innerHTML=TROPHIES.map(tr=>{
    const u=p.unlockedTrophies.includes(tr.id);
    return`<div class="trophy-item${u?'':' locked'}" title="${esc(trophyDesc(tr.id))}"><div class="trophy-icon-big">${tr.icon}</div><div class="trophy-name-sm">${esc(trophyName(tr.id))}</div></div>`;
  }).join('');
}
// Trophées attribués par le serveur : affichés un par un
let trophyQueue=[];
function announceTrophies(ids){
  (ids||[]).forEach(id=>{const tr=TROPHIES.find(x=>x.id===id);if(tr)trophyQueue.push(tr);});
  if(!document.getElementById('trophy-popup').classList.contains('show'))nextTrophyPopup();
}
function nextTrophyPopup(){const tr=trophyQueue.shift();if(tr)showTrophyPopup(tr);}
function showTrophyPopup(tr){
  document.getElementById('tp-icon').textContent=tr.icon;
  document.getElementById('tp-title').textContent=t('trophy_unlocked',{name:trophyName(tr.id)});
  document.getElementById('tp-desc').textContent=trophyDesc(tr.id);
  document.getElementById('tp-xp').textContent=t('xp_bonus',{n:tr.xp});
  document.getElementById('trophy-popup').classList.add('show');
  sfx('trophy'); haptic([60,40,60,40,120]); confetti(70);
}
function closePopup(){
  document.getElementById('trophy-popup').classList.remove('show');
  if(trophyQueue.length)setTimeout(nextTrophyPopup,150);
}

async function loadHunts(){
  const {data,error}=await sb.from('hunts_public').select('*').order('play_count',{ascending:false});
  if(error){toast(t('t_error',{msg:error.message}));return;}
  huntsCache=data||[];
  await decorateHunts();
  const codes=[...new Set(huntsCache.map(h=>h.country_code).filter(Boolean))];
  const sel=document.getElementById('disc-country'), cur=sel.value;
  sel.innerHTML=`<option value="">${esc(t('all_countries'))}</option>`+codes.map(c=>`<option value="${c}"${c===cur?' selected':''}>${flagOf(c)} ${esc(countryName(c))}</option>`).join('');
  sel.style.display=codes.length>1?'inline-block':'none';
  renderHuntList();
  if(discoverMap)addHuntMarkers();
}
// Ajoute langue, pays et nom traduit aux chasses (la vue publique ne les contient pas)
async function decorateHunts(){
  const ids=huntsCache.map(h=>h.id);
  if(!ids.length)return;
  const [{data:extra},{data:trs},{data:steps}]=await Promise.all([
    sb.from('hunts').select('id,lang,country_code,city').in('id',ids),
    sb.from('hunt_translations').select('hunt_id,lang,name').in('hunt_id',ids),
    sb.from('hunt_steps').select('hunt_id').in('hunt_id',ids),
  ]);
  const ex=Object.fromEntries((extra||[]).map(e=>[e.id,e]));
  huntsCache.forEach(h=>{
    Object.assign(h,ex[h.id]||{});
    // le nombre d'étapes de la vue publique est faussé (multiplié) : on le recompte
    if(steps)h.step_count=steps.filter(s=>s.hunt_id===h.id).length;
    h.lang=h.lang||'fr';
    const mine=(trs||[]).filter(x=>x.hunt_id===h.id);
    h.langs=[h.lang,...mine.map(x=>x.lang)];
    h.displayName=(LANG!==h.lang&&mine.find(x=>x.lang===LANG)?.name)||h.name;
  });
}
function renderHuntList(){
  const container=document.getElementById('hunt-list-container');
  const filter=document.getElementById('disc-country').value;
  const list=huntsCache.filter(h=>!filter||h.country_code===filter);
  document.getElementById('hunt-count-label').textContent=t('hunts_count',{n:list.length});
  if(!list.length){container.innerHTML=`<div class="loading">${esc(t('no_hunts'))}</div>`;return;}
  container.innerHTML=list.map((h,i)=>`
    <div class="hunt-mini${i===0?' sel':''}" id="hm-${h.id}" onclick="focusHunt('${h.id}',${Number(h.start_lat)},${Number(h.start_lng)})">
      <div>
        <div class="hm-title">${esc(h.displayName||h.name)}</div>
        <div class="hm-meta">
          <span>${h.country_code?flagOf(h.country_code)+' ':''}${esc(h.city||countryLabel(h.country))}</span>
          <span>${esc(t('steps_n',{n:h.step_count}))}</span><span>${esc(t('minutes',{n:h.duration_min}))}</span>
          <span>${esc(t('finished_n',{n:h.completions}))}</span>
          <span title="${(h.langs||[]).join(', ')}">${(h.langs||[]).map(l=>LANGS[l]?.flag||l).join('')}</span>
        </div>
      </div>
      <button class="btn btn-amber btn-sm" onclick="event.stopPropagation();startPlay('${h.id}')">${esc(t('play'))}</button>
    </div>`).join('');
}
function initDiscoverMap(){
  if(discoverMap)return;
  discoverMap=L.map('discover-map',{zoomControl:true,attributionControl:false}).setView([46.5,2.5],5);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18}).addTo(discoverMap);
  discLayer=L.layerGroup().addTo(discoverMap);
}
function addHuntMarkers(){
  discLayer.clearLayers();
  huntsCache.forEach(h=>{
    const icon=L.divIcon({className:'',iconSize:[34,44],iconAnchor:[17,44],
      html:`<div style="width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#BA7517;border:2px solid white;display:flex;align-items:center;justify-content:center;"><span style="transform:rotate(45deg);font-size:15px;">🏴</span></div>`});
    L.marker([h.start_lat,h.start_lng],{icon}).addTo(discLayer)
      .on('click',()=>focusHunt(h.id,h.start_lat,h.start_lng))
      .bindPopup(`<b>${esc(h.displayName||h.name)}</b><br>${esc(h.city||'')}`);
  });
}
function focusHunt(id,lat,lng){
  document.querySelectorAll('.hunt-mini').forEach(c=>c.classList.remove('sel'));
  const el=document.getElementById('hm-'+id);
  if(el){el.classList.add('sel');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
  if(discoverMap)discoverMap.flyTo([lat,lng],14,{duration:0.9});
}

function initLbMap(){
  if(lbMap)return;
  lbMap=L.map('lb-map',{zoomControl:false,attributionControl:false}).setView([46.5,2.5],3);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:6}).addTo(lbMap);
}
async function loadLeaderboard(){
  document.getElementById('lb-list').innerHTML='<div class="loading"><span class="spinner"></span></div>';
  let query=sb.from('leaderboard').select('*').limit(50);
  if(currentFilter==='pays'){
    if(!profile.id){toast(t('t_need_profile'));return;}
    query=query.like('country',flagOf(profile.countryCode)+'%');
  }
  if(currentFilter==='semaine')query=query.gte('last_seen',new Date(Date.now()-7*864e5).toISOString());
  const {data,error}=await query;
  if(error){toast(t('t_scores_error'));return;}
  renderLb(data||[]);
  if(lbMap){
    if(!lbLayer)lbLayer=L.layerGroup().addTo(lbMap);
    lbLayer.clearLayers();
    (data||[]).filter(p=>p.gps_lat).forEach(p=>{
      const icon=L.divIcon({className:'',iconSize:[32,32],iconAnchor:[16,16],
        html:`<div style="width:32px;height:32px;border-radius:50%;background:#FAEEDA;border:2px solid #BA7517;display:flex;align-items:center;justify-content:center;font-size:17px;">${esc(p.emoji)}</div>`});
      L.marker([p.gps_lat,p.gps_lng],{icon}).addTo(lbLayer).bindPopup(`<b>${esc(p.pseudo)}</b> — ${esc(p.xp)} XP`);
    });
  }
}
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadLeaderboard();
}
function renderLb(data){
  const myRank=data.findIndex(p=>p.id===profile.id);
  if(myRank>=0&&currentFilter==='mondial')document.getElementById('p-world-rank').textContent='#'+(myRank+1);
  document.getElementById('lb-list').innerHTML=data.map((p,i)=>{
    const rk=i+1,medal=rk===1?'🥇':rk===2?'🥈':rk===3?'🥉':rk;
    const isMe=p.id===profile.id;
    const icons=(p.trophies||[]).slice(0,3).map(id=>TROPHIES.find(x=>x.id===id)?.icon||'').join('');
    return`<div class="lb-row${isMe?' me':''}">
      <div class="lb-rank ${rk<=3?'r'+rk:''}">${medal}</div>
      <div class="lb-emo">${esc(p.emoji)}</div>
      <div><div class="lb-pseudo">${esc(p.pseudo)}${isMe?' '+esc(t('me')):''}</div><div class="lb-country">${esc(countryLabel(p.country))}</div></div>

async function joinByCode(){
  const code=document.getElementById('join-code').value.trim().toUpperCase();
  if(!code){toast(t('t_enter_code'));return;}
  const {data,error}=await sb.from('hunts').select('id').eq('access_code',code).eq('status','publiee').maybeSingle();
  if(error||!data){toast(t('t_code_unknown'));return;}
  startPlay(data.id);
}
async function startPlay(huntId){
  if(!profile.id){toast(t('t_need_profile'));showView('profil');return;}
  const {data:hunt,error}=await sb.from('hunts').select('*').eq('id',huntId).single();
  if(error||!hunt){toast(t('e_hunt_unknown'));return;}
  // Les réponses ne sont jamais chargées : le serveur les vérifie
  const {data:steps,error:se}=await sb.from('hunt_steps').select(STEP_COLS).eq('hunt_id',huntId).order('step_order');
  if(se){toast(t('t_steps_error'));console.error(se);return;}
  hunt.steps=steps||[];
  if(!hunt.steps.length){toast(t('t_no_steps'));return;}
  // Session créée par le serveur ; s'il y a une partie en cours sur cette chasse, il la reprend
  const {data:sid,error:sErr}=await sb.rpc('tw_start_session',{p_hunt_id:huntId});
  if(sErr){toast(errMsg(sErr));console.error(sErr);return;}
  const {data:sess}=await sb.from('game_sessions').select('current_step,started_at').eq('id',sid).single();
  await loadHuntTranslations(hunt);
  currentHunt=hunt; sessionId=sid; gameStarted=false; gameFinished=false;
  currentStep=Math.min(sess?.current_step||0,hunt.steps.length-1);
  sessionStart=sess?.started_at?new Date(sess.started_at).getTime():Date.now();
  showView('jouer');
  document.getElementById('join-screen').style.display='none';
  document.getElementById('game-screen').style.display='block';
  document.getElementById('g-title').textContent=huntName(hunt);
  document.getElementById('player-emo').textContent=profile.emoji||'🧭';
  renderIntro();
}
// Textes de la chasse dans la langue du joueur (repli sur la langue d'origine)
async function loadHuntTranslations(h){
  h.tr=null; h.stepTr={};
  const base=h.lang||'fr';
  if(LANG===base)return;
  const [{data:ht},{data:st}]=await Promise.all([
    sb.from('hunt_translations').select('name,description').eq('hunt_id',h.id).eq('lang',LANG).maybeSingle(),
    sb.from('step_translations').select('step_id,text,hint').eq('lang',LANG).in('step_id',h.steps.map(s=>s.id)),
  ]);
  h.tr=ht||null;
  (st||[]).forEach(x=>h.stepTr[x.step_id]=x);
}
const huntName=h=>h.tr?.name||h.name;
const huntDesc=h=>h.tr?.description||h.description;
const stepText=s=>currentHunt?.stepTr?.[s.id]?.text||s.text||'';
const stepHint=s=>currentHunt?.stepTr?.[s.id]?.hint||s.hint;

// Clic sur « Commencer » : ce geste autorise son, boussole et GPS
async function beginAdventure(){

function togglePMap(){
  const w=document.getElementById('player-map-wrap');
  w.style.display=w.style.display!=='none'?'none':'block';
  if(w.style.display!=='none')setTimeout(()=>{
    if(!playerMap){

      playerMap=L.map('player-map',{zoomControl:false,attributionControl:false}).setView([s.lat,s.lng],16);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20}).addTo(playerMap);
      drawPSteps();
      if(lastPos&&playerMarker)playerMarker.setLatLng(lastPos);

function drawPSteps(){
  if(!playerMap||!currentHunt)return;
  currentHunt.steps.forEach((s,i)=>{
    const done=i<currentStep,cur=i===currentStep;
    const bg=done?'#EAF3DE':cur?'#EEEDFE':'#F1EFE8';
    const bd=done?'#639922':cur?'#7F77DD':'#888780';
    const col=done?'#27500A':cur?'#26215C':'#444441';
    const icon=L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],
      html:`<div style="width:24px;height:24px;border-radius:50%;background:${bg};border:2px solid ${bd};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:${col};">${done?'✓':(i+1)}</div>`});
    L.marker([s.lat,s.lng],{icon}).addTo(playerMap);
    if(cur)L.circle([s.lat,s.lng],{radius:s.trigger_radius||20,color:'#7F77DD',fillColor:'#EEEDFE',fillOpacity:0.25,weight:1.5,dashArray:'4,3'}).addTo(playerMap);
  });
  const s=currentHunt.steps[Math.min(currentStep,currentHunt.steps.length-1)];
  const icon=L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],
    html:`<div style="width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #7F77DD;display:flex;align-items:center;justify-content:center;font-size:16px;">${esc(profile.emoji)}</div>`});
  if(!playerMarker)playerMarker=L.marker([s.lat,s.lng],{icon}).addTo(playerMap);
}
function startGPS(){
  if(!navigator.geolocation){toast(t('gps_unavailable'));return;}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(pos=>{
    const{latitude:lat,longitude:lng}=pos.coords;
    lastPos=[lat,lng];
    if(playerMarker)playerMarker.setLatLng(lastPos);
    playerMap&&playerMap.panTo(lastPos);
    const s=currentHunt?.steps[currentStep];
    if(s&&gameStarted&&!gameFinished)onDist(haversine(lat,lng,s.lat,s.lng),s.trigger_radius||20);
    syncGps(lat,lng);
  },err=>{if(err.code===1)toast(t('allow_location'));},{enableHighAccuracy:true,maximumAge:1000,timeout:10000});
}
function stopGPS(){
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=null;
}
// Envoi limité (toutes les 15 s). La position publique du joueur est arrondie à ~1 km.
async function syncGps(lat,lng){
  const now=Date.now();
  if(now-lastGpsSync<GPS_SYNC_MS)return;
  lastGpsSync=now;
  const ts=new Date().toISOString();
  if(profile.id)await sb.from('players').update({gps_lat:Math.round(lat*100)/100,gps_lng:Math.round(lng*100)/100,gps_updated:ts}).eq('id',profile.id);
  if(sessionId)await sb.from('game_sessions').update({current_lat:lat,current_lng:lng,gps_updated:ts}).eq('id',sessionId);
}
function onDist(dist,radius){
  const el=document.getElementById('prox-num');
  if(!el)return;
  el.textContent=Math.round(dist);
  const bar=document.getElementById('prox-fill');
  if(bar)bar.style.width=Math.max(0,Math.min(100,100-dist/200*100))+'%';
  updateCompass(dist,radius);
  if(dist<=radius){
    document.getElementById('prox-ok').style.display='block';
    document.getElementById('prox-locked').style.display='none';
    const input=document.getElementById('step-input'); if(input)input.style.display='block';
    if(zoneReachedStep!==currentStep){
      zoneReachedStep=currentStep;
      sfx('unlock'); haptic([100,60,100]);
      document.querySelector('.prox-box')?.classList.add('reached');
    }
  }
}

// Boussole « chaud / froid »
let deviceHeading=null, zoneReachedStep=-1, prevDist=null, lastBearing=null;
function bearing(la1,ln1,la2,ln2){
  const r=Math.PI/180, y=Math.sin((ln2-ln1)*r)*Math.cos(la2*r);
  const x=Math.cos(la1*r)*Math.sin(la2*r)-Math.sin(la1*r)*Math.cos(la2*r)*Math.cos((ln2-ln1)*r);
  return (Math.atan2(y,x)/r+360)%360;
}
const cardinal=b=>t('dirs')[Math.round(b/45)%8];
function onOrientation(e){
  if(typeof e.webkitCompassHeading==='number')deviceHeading=e.webkitCompassHeading;       // iOS
  else if(e.absolute&&typeof e.alpha==='number')deviceHeading=(360-e.alpha)%360;          // Android
  else return;
  const arrow=document.getElementById('compass-arrow');
  if(arrow&&lastBearing!=null)arrow.style.transform=`rotate(${lastBearing-deviceHeading}deg)`;
}
async function enableCompass(){
  if(!('DeviceOrientationEvent' in window))return;
  try{
    if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')return;
  }catch(e){return;}
  window.removeEventListener('deviceorientationabsolute',onOrientation);
  window.removeEventListener('deviceorientation',onOrientation);
  window.addEventListener('ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation',onOrientation);
}
function updateCompass(dist,radius){
  const arrow=document.getElementById('compass-arrow'), heat=document.getElementById('heat'), sub=document.getElementById('heat-sub');
  if(!arrow||!lastPos)return;
  const s=currentHunt.steps[currentStep];
  const b=lastBearing=bearing(lastPos[0],lastPos[1],s.lat,s.lng);
  arrow.style.transform=`rotate(${b-(deviceHeading??0)}deg)`;
  const [key,color]=dist<=radius?['heat_here','#C2410C']:dist<50?['heat_burning','#C2410C']:dist<150?['heat_hot','#BA7517']
    :dist<400?['heat_warm','#8A6D1F']:dist<1000?['heat_cold','#2563A8']:['heat_ice','#1E3A8A'];
  heat.textContent=t(key); heat.style.color=color;
  let trend='';
  if(prevDist!=null&&dist>radius){
    if(dist<prevDist-3)trend=t('trend_closer');
    else if(dist>prevDist+3)trend=t('trend_farther');
  }
  prevDist=dist;
  sub.textContent=dist<=radius?t('heat_secret'):trend+t('direction',{d:cardinal(b)})+(deviceHeading==null?t('north_up'):'');
}

  else if(type==='prox')inputHtml=`<div id="step-input" class="step-input"><button class="btn btn-teal" style="width:100%;" onclick="reachStep()">${esc(t('reached_continue'))}</button></div>`;
  else inputHtml=`<div id="step-input" class="step-input"><div class="ans-row"><input type="text" id="ans" placeholder="${esc(t('answer_ph'))}" onkeydown="if(event.key==='Enter')checkAns()"/><button class="btn btn-amber btn-sm" onclick="checkAns()">${esc(t('validate'))}</button></div></div>`;
  document.getElementById('step-body').innerHTML=`<div class="step-enter">
    <div style="margin-bottom:6px;"><span style="font-size:10px;padding:2px 8px;border-radius:99px;background:${tBg};color:${tCol};">${esc(t('type_'+type))}</span></div>
    <div class="enigme-txt" id="enigme-txt" title="${esc(t('tap_all'))}"></div>

      <div class="prox-row"><div><span class="prox-num" id="prox-num">—</span><span style="font-size:11px;color:#888;"> m</span></div><div class="prox-track"><div class="prox-fill" id="prox-fill" style="width:0%"></div></div></div>
      <div class="prox-locked" id="prox-locked">${esc(t('prox_locked',{r:s.trigger_radius||20}))}</div>

      <div class="compass">
        <div class="compass-dial"><div class="compass-arrow" id="compass-arrow">➤</div></div>
        <div><div class="heat" id="heat">${esc(t('gps_search'))}</div><div class="heat-sub" id="heat-sub">${esc(t('gps_search_sub'))}</div></div>
      </div>

    ${inputHtml}

    <div class="fb-ok" id="fb-ok">${esc(t('ok_'+type))}</div>

  typeText(document.getElementById('enigme-txt'),stepText(s),28);
  if(playerMap){playerMap.eachLayer(l=>{if(!(l instanceof L.TileLayer))playerMap.removeLayer(l);});playerMarker=null;drawPSteps();playerMap.setView([s.lat,s.lng],16);if(lastPos&&playerMarker)playerMarker.setLatLng(lastPos);}
  if(lastPos)onDist(haversine(lastPos[0],lastPos[1],s.lat,s.lng),s.trigger_radius||20);
}
function simArrival(){onDist(5,(currentHunt?.steps[currentStep]?.trigger_radius)||20);}
let hintUsed=false, stepBusy=false;
function showHint(){hintUsed=true;const h=document.getElementById('hint-box');h.style.display=h.style.display==='block'?'none':'block';}
// Réponse du serveur après une tentative : étape suivante ou fin de chasse
function onStepResult(res,koMsg){
  if(!res.correct){
    const ko=document.getElementById('fb-ko');
    ko.textContent=koMsg; ko.style.display='block';
    document.getElementById('fb-ok').style.display='none';
    sfx('ko'); haptic(200);
    const box=document.getElementById('step-input');
    if(box){box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');}
    return;
  }
  sfx(res.finished?'finish':'ok'); haptic(res.finished?[80,50,80,50,200]:60);
  document.getElementById('fb-ok').style.display='block';
  document.getElementById('fb-ko').style.display='none';
  const inp=document.getElementById('ans'); if(inp)inp.disabled=true;
  hintUsed=false;
  setTimeout(()=>{
    currentStep=res.current_step;
    if(res.finished)finishHunt(res);else renderStep();
  },1200);
}
async function checkAns(){
  const inp=document.getElementById('ans');if(!inp||inp.disabled||stepBusy)return;
  const val=inp.value.trim();
  if(!val)return;
  stepBusy=true;
  const {data,error}=await sb.rpc('tw_submit_answer',{p_session:sessionId,p_answer:val,p_hint:hintUsed});
  stepBusy=false;
  if(error){console.error(error);toast(errMsg(error));return;}
  onStepResult(data,t('ko_answer'));
}
// Étapes « arrivée » : le serveur contrôle la distance avec la dernière position GPS
async function reachStep(){
  if(stepBusy)return;
  stepBusy=true;
  const {data,error}=await sb.rpc('tw_reach_step',{p_session:sessionId,p_lat:lastPos?lastPos[0]:null,p_lng:lastPos?lastPos[1]:null});
  stepBusy=false;
  if(error){console.error(error);toast(errMsg(error));return;}
  onStepResult(data,data.distance!=null?t('ko_dist',{d:data.distance}):t('ko_pos'));
}
async function finishHunt(res){
  gameFinished=true;

  document.getElementById('step-body').innerHTML=`
    <div class="parchment step-enter" style="text-align:center;">
      <div style="font-size:48px;margin-bottom:6px;">🏆</div>
      <h3>${esc(t('finish_title'))}</h3>
      <div style="font-size:12px;opacity:.75;margin-bottom:10px;">${esc(huntName(currentHunt))}</div>
      <div style="font-size:18px;color:#7F77DD;font-weight:700;margin-bottom:4px;">+${Number(res.hunt_xp)||0} XP</div>

        <button class="btn btn-amber" onclick="showView('scores')">${esc(t('see_scores'))}</button>

function randomQRCode(){

  return 'TW-'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>abc[b%abc.length]).join('');
}
function confirmCStep(){
  if(!cPending){toast(t('t_click_map'));return;}
  const text=document.getElementById('c-enigme').value.trim();

  if(type!=='prox'&&!ans){toast(t('t_add_answer'));return;}

// Redessine la liste et la carte à partir de cStepsData (source unique)
function renderCSteps(){
  cMarkers.forEach(m=>creatorMap.removeLayer(m));
  cCircles.forEach(c=>creatorMap.removeLayer(c));
  cMarkers=[];cCircles=[];
  document.getElementById('c-steps-list').innerHTML=cStepsData.map((s,i)=>{
    const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,13],
      html:`<div style="width:26px;height:26px;border-radius:50%;background:#FAEEDA;border:2px solid #BA7517;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#633806;">${i+1}</div>`});
    cMarkers.push(L.marker([s.lat,s.lng],{icon}).addTo(creatorMap).bindPopup(esc(s.text)));

    const tLabel=s.step_type==='qr'?t('type_qr'):s.step_type==='prox'?t('step_arrival'):t('type_enigme');

  }).join('');

async function publishHunt(){
  if(!profile.id){toast(t('t_need_profile'));return;}
  const name=document.getElementById('c-name').value.trim();
  const code=document.getElementById('c-code').value.trim().toUpperCase();
  if(!name||!code){toast(t('t_name_code'));return;}
  if(cStepsData.length<2){toast(t('t_two_steps'));return;}
  const cc=document.getElementById('c-country').value, hl=document.getElementById('c-lang').value;
  const first=cStepsData[0];
  const {data:hunt,error}=await sb.from('hunts').insert({
    creator_id:profile.id, name, access_code:code,
    country:countryStored(cc,hl), country_code:cc, lang:hl,
    city:document.getElementById('c-city').value.trim(),
    duration_min:parseInt(document.getElementById('c-duration').value),
    difficulty:document.getElementById('c-diff').value,
    description:document.getElementById('c-desc').value,
    status:'publiee',
    start_lat:first.lat, start_lng:first.lng,

  if(error){toast(t('t_publish_error',{msg:error.message||error.code}));return;}
  const {error:se}=await sb.from('hunt_steps').insert(cStepsData.map((s,i)=>({...s,hunt_id:hunt.id,step_order:i+1})));
  if(se){toast(t('t_publish_error',{msg:se.message}));return;}
  toast(t('t_published',{c:code}),5000);
  lastPublished={name,code,steps:cStepsData.map((s,i)=>({...s,step_order:i+1}))};
  const nQR=lastPublished.steps.filter(s=>s.step_type==='qr').length;

let scanStream=null, scanCb=null, scanRaf=null, scanDetector=null;
const scanCanvas=document.createElement('canvas');
async function openScanner(title,cb){
  scanCb=cb;
  document.getElementById('scan-title').textContent=title;
  document.getElementById('scan-manual').value='';
  document.getElementById('scan-msg').textContent=t('scan_aim');
  document.getElementById('scan-modal').classList.add('show');
  const video=document.getElementById('scan-video');
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});}
  catch(e){document.getElementById('scan-msg').textContent=t('scan_nocam');return;}
  if(!scanCb){closeScanner();return;}
  video.srcObject=scanStream;
  try{await video.play();}catch(e){}
  scanDetector=null;
  if('BarcodeDetector' in window){try{scanDetector=new BarcodeDetector({formats:['qr_code']});}catch(e){}}
  scanLoop();
}
async function scanLoop(){
  if(!scanStream)return;
  const video=document.getElementById('scan-video');
  let text=null;
  if(video.readyState>=2&&video.videoWidth){
    if(scanDetector){
      try{const r=await scanDetector.detect(video);if(r.length)text=r[0].rawValue;}catch(e){scanDetector=null;}
    }else if(window.jsQR){
      const scale=Math.min(1,640/video.videoWidth);
      const w=scanCanvas.width=Math.round(video.videoWidth*scale), h=scanCanvas.height=Math.round(video.videoHeight*scale);
      const ctx=scanCanvas.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(video,0,0,w,h);
      const r=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
      if(r&&r.data)text=r.data;
    }
  }
  if(text){finishScan(text);return;}
  if(scanStream)scanRaf=requestAnimationFrame(scanLoop);
}
function finishScan(text){
  const cb=scanCb;
  closeScanner();
  haptic(80);
  if(cb&&text.trim())cb(text.trim());
}
function submitManualScan(){const v=document.getElementById('scan-manual').value.trim();if(v)finishScan(v);}
function closeScanner(){
  cancelAnimationFrame(scanRaf);
  if(scanStream)scanStream.getTracks().forEach(tr=>tr.stop());
  scanStream=null; scanCb=null;
  document.getElementById('scan-video').srcObject=null;
  document.getElementById('scan-modal').classList.remove('show');
}
function scanEntryQR(){
  openScanner(t('scan_entry_title'),text=>{
    document.getElementById('join-code').value=text.toUpperCase().slice(0,8);
    joinByCode();
  });
}
function scanStepQR(){openScanner(t('scan_step_title',{n:currentStep+1}),submitQR);}
async function submitQR(text){
  if(stepBusy)return;
  stepBusy=true;
  const {data,error}=await sb.rpc('tw_submit_answer',{p_session:sessionId,p_answer:text,p_hint:false});
  stepBusy=false;
  // Ancienne étape QR créée sans contenu : validée par la position GPS
  if(error&&(error.message||'').includes('mauvais_type_etape'))return reachStep();
  if(error){console.error(error);toast(errMsg(error));return;}
  onStepResult(data,t('ko_qr'));
}
let lastPublished=null;
function qrDataURL(text){
  const div=document.createElement('div');
  new QRCode(div,{text,width:512,height:512,correctLevel:QRCode.CorrectLevel.M});
  const c=div.querySelector('canvas');
  return c?c.toDataURL('image/png'):div.querySelector('img').src;
}
// Page imprimable : QR d'entrée + un QR par étape « QR »
function printQRCodes(p=lastPublished){
  if(!p)return;

  const cards=[card(t('print_entry',{name:p.name}),t('print_entry_sub'),p.code)]

<style>body{font-family:'Segoe UI',system-ui,sans-serif;margin:0;padding:16px;color:#1a1a18;background:#fff;}
.card{break-inside:avoid;page-break-inside:avoid;border:1px dashed #bbb;border-radius:12px;padding:18px;margin:0 auto 18px;max-width:420px;text-align:center;}
h2{font-size:18px;margin:0 0 4px;}p{font-size:13px;color:#555;margin:0 0 10px;}img{width:260px;height:260px;}
.code{font-family:monospace;font-size:18px;letter-spacing:2px;margin-top:6px;}

let audioCtx=null, soundOn=true;
try{soundOn=localStorage.getItem('tw_sound')!=='off';}catch(e){}
function initAudio(){
  if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function renderSoundBtn(){document.getElementById('snd-btn').textContent=soundOn?'🔊':'🔇';}
function toggleSound(){
  soundOn=!soundOn;
  try{localStorage.setItem('tw_sound',soundOn?'on':'off');}catch(e){}
  renderSoundBtn();
  if(soundOn){initAudio();sfx('ok');}
}
function tone(freq,start,dur,type='sine',vol=.18){
  const t0=audioCtx.currentTime+start, o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
const SFX={
  start: ()=>[392,523,659].forEach((f,i)=>tone(f,i*.12,.35,'triangle')),
  unlock:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.4,'sine',.2)),
  ok:    ()=>{tone(659,0,.18,'triangle');tone(988,.12,.35,'triangle');},
  ko:    ()=>{tone(196,0,.25,'sawtooth',.08);tone(147,.15,.35,'sawtooth',.08);},
  trophy:()=>[523,523,523,659,784,1047].forEach((f,i)=>tone(f,[0,.12,.24,.36,.52,.68][i],i===5?.7:.16,'square',.07)),
  finish:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.14,i===5?.9:.2,'triangle',.18)),
};
function sfx(name){if(!soundOn)return;try{initAudio();if(audioCtx&&SFX[name])SFX[name]();}catch(e){}}
function haptic(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
// Texte qui s'écrit lettre par lettre ; une touche affiche tout d'un coup
function typeText(el,text,speed){
  if(!el)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=text;return;}
  const token={}; el._typing=token;
  let i=0;
  el.textContent=''; el.classList.add('typing');
  const done=()=>{el.textContent=text;el.classList.remove('typing');el._typing=null;};
  el.onclick=()=>{if(el._typing===token)done();};
  (function step(){
    if(el._typing!==token)return;
    if(i>=text.length){done();return;}
    i=Math.min(text.length,i+(text.length>400?3:1));
    el.textContent=text.slice(0,i);
    setTimeout(step,/[.!?…]/.test(text[i-1])?speed*8:speed);
  })();
}
function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas'); c.id='confetti';
  c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  const ctx=c.getContext('2d'), colors=['#BA7517','#FAC775','#7F77DD','#0F6E56','#E24B4A','#FFFFFF'];
  const parts=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,
    vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,
    w:6+Math.random()*6,h:4+Math.random()*4,col:colors[Math.random()*colors.length|0]}));
  const t0=performance.now();
  (function frame(now){
    ctx.clearRect(0,0,c.width,c.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(now-t0<3500)requestAnimationFrame(frame);else c.remove();
  })(t0);
}
